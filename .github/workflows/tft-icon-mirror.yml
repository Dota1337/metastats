name: TFT-Bilder-Kopie

# Haelt die eigene Kopie aller TFT-Bilder im Vercel-Blob-Speicher vollstaendig
# (scripts/mirror-tft-icons.mjs). Der Bild-Weiterleiter /api/img liest zuerst
# dort; fehlt ein Bild, faellt er auf CommunityDragon zurueck.
#
# Stuendlich, weil neue Bilder mit jeder Datei-Aktualisierung (Wochenlauf,
# Comps, B-Patch) auftauchen koennen und CommunityDragon zeitweise ausfaellt —
# ein Lauf ohne fehlende Bilder ist nach dem Auflisten (3 Aufrufe) fertig.
# Donnerstags nach dem Patch-Mittwoch zusaetzlich `--refresh`: CDragon
# `latest` kann unter gleichem Pfad neue Bytes liefern.
#
# Schreibt nichts ins Repo, deshalb nur Lese-Rechte.

on:
  schedule:
    - cron: '23 * * * *'
    - cron: '40 3 * * 4'
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Aktuelles Bundle neu holen und geaenderte Bilder ersetzen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tft-icon-mirror
  cancel-in-progress: false

jobs:
  # Der Server stoesst diesen Lauf puenktlich an (scripts/gh-dispatch-due.mjs, Box alle 5 min), weil
  # GitHub die Zeitplaene seit 02.11.2026 Stunden zu spaet oder gar nicht startet. Kommt der Zeitplan
  # hinterher, nachdem der Anstoss schon lief, entfaellt der Doppel-Lauf. Ohne Anstoss vom Server
  # (kein workflow_dispatch im Fenster) laeuft der Zeitplan wie bisher.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW_MIN: '55'
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            since=$(date -u -d "-$WINDOW_MIN min" +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tft-icon-mirror.yml --event workflow_dispatch --created ">=$since" --json databaseId -q length || echo 0)
            if [ "${n:-0}" -gt 0 ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Lauf noetig: $run"

  mirror:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Bilder kopieren
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REFRESH: ${{ github.event.schedule == '40 3 * * 4' || inputs.refresh == true }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            node scripts/mirror-tft-icons.mjs --refresh --max-minutes=50
          else
            node scripts/mirror-tft-icons.mjs --max-minutes=50
          fi
