name: TFT Tournament Weekly Crawl

on:
  schedule:
    # Wednesday 09:00 UTC. Phased after Sunday's pro-player crawl so the
    # tournament-results placement→puuid join has the fresh pro list.
    - cron: '0 9 * * 3'
  workflow_dispatch:

# contents: write — the crawler resolves event-dated FX rates (prize-money
# conversion) and caches them in data/fx-rates.json, committed back below so
# re-runs are deterministic and offline-capable.
permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Auto-discovery from Liquipedia S/A-Tier categories yields ~300 pages, and
    # the public wikitext ToU forces a 30s delay between requests → ~150 min
    # floor. 180 min keeps headroom for retries / expandtemplates extra-calls.
    # Once we have an LPDB API key the delay drops to the documented per-second
    # limit (~5 min total).
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Crawl TFT tournaments
        run: node scripts/crawl-tft-tournaments.mjs

      # Commit-back of the FX-rate cache (same race-safe retry pattern as the
      # daily/weekly crawl workflows). Without this, every weekly run re-fetches
      # the same historical rates and a frankfurter outage would silently NULL
      # newly crawled prize conversions.
      - name: Commit FX-rate cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fx-rates.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new FX rates."
          else
            git commit -m "chore: weekly TFT tournament FX-rate cache"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
          fi
