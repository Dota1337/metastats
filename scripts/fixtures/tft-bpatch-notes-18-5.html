<html><head></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"page":{"url":"https://teamfighttactics.leagueoflegends.com/en-us/news/game-updates/teamfight-tactics-patch-18-5/","title":"TFT patch 18.5","displayedPublishDate":"2026-10-20T18:00:00.000Z","blades":[{"type":"articleMasthead"},{"type":"patchNotesRichText","richText":{"body":"<header class=\"header-primary\"><h2 id=\"patch-midpatch-updates\">MID-PATCH UPDATE</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h3 class=\"change-detail-title\">OCTOBER 27TH</h3><blockquote class=\"blockquote context\"><p>Over the first week of Patch 18.5, we've seen two comps rise above others, both in popularity and power.&nbsp;<br><br>Brambleback and Kha’Zix: Brambleback's buffs combined with 7 Riftbeast have made him rip through tanks like they’re paper, while Kha’Zix continues to evolve past the nerfs we throw his way, finding an unbeatable position with optimal set-ups.&nbsp;<br><br>Hand of Justice: While both of the Champions above take advantage of the power of Hand of Justice, the item has been outperforming other melee-carry options ever since its Omnivamp buffs earlier this set by turning high-damage carries into drain tanks (also with high damage).</p></blockquote><ul><li>Kha’Zix<ul><li>Base Damage: 250/345/500 <span class=\"change-indicator\">⇒ </span>230/310/450 AP</li><li>Isolated Damage: 280/390/590 <span class=\"change-indicator\">⇒ </span>250/350/530 AP</li></ul></li><li>Brambleback<ul><li>Armor Ignore (AP): 25% <span class=\"change-indicator\">⇒ </span>10%</li><li>Armor Ignore Base: 25% <span class=\"change-indicator\">⇒ </span>30%</li></ul></li><li>Hand of Justice<ul><li>Omnivamp: 15% <span class=\"change-indicator\">⇒ </span>12%</li><li>Radiant Omnivamp: 30% <span class=\"change-indicator\">⇒ </span>25%</li></ul></li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h3 class=\"change-detail-title\">OCTOBER 22ND</h3><blockquote class=\"blockquote context\"><p>We’ve got a partial revert on a Brambleback buff, Wisps cost clean-up, and a few bug fixes for our B-patch.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">CHAMPIONS</h4><blockquote class=\"blockquote context\"><p>Brambleback: The big winner of Patch 18.5 won out too much. We’re reverting his Alpha Mark heal, while keeping the Armor Ignore buff from 18.5 so as to not force him back out of the meta.</p></blockquote><ul><li>Brambleback: Healing On-Hit: 5% <span class=\"change-indicator\">⇒</span> 4%</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">WISPS</h4><blockquote class=\"blockquote context\"><p>A couple of these Wisps were showing up even when they couldn’t be purchased due to them being more expensive than the base version. Since they aren’t overperforming and it’s more intuitive for them to match costs, we’re making the small adjustments necessary to get them in the right place.</p></blockquote><ul><li>Die Roll: Upgrade Cost: 3 <span class=\"change-indicator\">⇒</span> 2</li><li>Downpour: Upgrade Cost: 3 <span class=\"change-indicator\">⇒</span> 2</li><li>Hero's Entrance: Upgraded Cost: 4 <span class=\"change-indicator\">⇒</span> 2</li><li>Hireling: Base Cost: 2 <span class=\"change-indicator\">⇒</span> 5</li><li>Knick-Knack Bag: Upgrade Cost: 2 <span class=\"change-indicator\">⇒</span> 1</li><li>Moonlight Ritual: Base Cost: 2 <span class=\"change-indicator\">⇒</span> 3</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">BUG FIXES</h4><ul><li>Elderwood Emblem’s stats have been properly corrected after having their nerf from 18.4 temporarily reverted.</li><li>Luxury Subscription correctly grants 2-star 1-cost champions.</li><li>U.R.F. and Spreading Roots are now properly excluded</li><li>Abandon Ship’s Blossom Upgrade properly costs 2 gold.</li></ul></div></div></div><header class=\"header-primary\">"}}]}}}}</script></body></html>
