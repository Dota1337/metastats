<html><head></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"page":{"url":"https://teamfighttactics.leagueoflegends.com/en-us/news/game-updates/teamfight-tactics-patch-18-2/","title":"TFT patch 18.2","displayedPublishDate":"2026-09-09T18:00:00.000Z","blades":[{"type":"articleMasthead"},{"type":"patchNotesRichText","richText":{"body":"<header class=\"header-primary\"><h2 id=\"patch-midpatch-updates\">MID-PATCH UPDATE</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">SEPTEMBER 14</h4><blockquote class=\"blockquote context\"><p>18.2 set out to enable fast 9 strategies amidst a reroll-heavy meta of 18.1, but through more econ via cheaper Wisps, lower leveling costs, and powerful buffs, Legendary-soup variations quickly shifted what S-tier stands for.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">SYSTEMS</h4><blockquote class=\"blockquote context\"><p>Our 18.2 changes to XP reduced the cost of going to Level 10 by 12 gold—that’s a lot in the world of TFT, especially when you’re saving anywhere from 5-15 gold on cheaper Wisps. We’re not doing a total revert of the XP changes here, as we’re keeping it cheaper to go from Level 7 to 8 by 4 XP/gold, but 9 and 10 are getting their changes reverted.</p></blockquote><ul><li>XP From Level 8-9: 64 <span class=\"change-indicator\">⇒</span> 68</li><li>XP From Level 9-10: 64 <span class=\"change-indicator\">⇒</span> 68</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">AUGMENTS</h4><blockquote class=\"blockquote context\"><p>As expected, Expected Unexpectedness has been re-enabled, but a newly unexpected bug has had us pull Nesting Dolls temporarily.</p></blockquote><ul><li>Expected Unexpectedness Re-enabled</li><li>Nesting Dolls Disabled due to a bug</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">UNITS</h4><blockquote class=\"blockquote context\"><p>Camille has found her place as a powerful reroll carry in Solar/Ravager boards even in a meta that leans towards fast 9. Since we’re nerfing all our Level 9/10 comps and a few more pricey units, we’re pre-emptively delivering a weightier nerf for our best performing reroll comps.<br><br>LeBlanc is still being used as more of a reroll printer than a unit that sticks around on end-game boards. We’re lowering her base chance to print at three-stars, but as an itemized carry she should still be pretty consistent as a champ printer since the bonus chance via takedowns is unchanged.<br><br>Fixed some odd bugs that had Brambleback’s Armor Ignore being higher than intended in cases where he was not building AP and lowering when he built AP. Brambleback will be stronger with things like Titan’s Resolve, Bloodthirster, Edge of Night—all of which grant AP, but he will be slightly weaker without these Items or other sources of AP.<br><br>Even before the rise of fast 9, Draven had some powerful Bounties that leveraged easier tasks for substantial rewards. Draven is a reward unto himself (just like you), so we’re trimming the easier rewards or just making them slightly harder (I’m sure he can handle it).<br><br>With Level 8 cheaper, players are getting Maokai online much easier (same applies to Draven) and are able to stack up a lot more HP. We love the Old Growth, giant HP bar fantasy, so our nerfs are targeted at his ability to repeatedly cast and heal up over the course of a fight.</p></blockquote><ul><li>Camille Ability Damage: 160/240/410/700 AD <span class=\"change-indicator\">⇒</span> 150/225/375/640 AD</li><li>Leblanc Clone Chance: 10/15/40% <span class=\"change-indicator\">⇒</span> 10/15/30%</li><li>Teemo Small Shroom Damage: 60/90/135 AP <span class=\"change-indicator\">⇒</span> 55/82/130 AP</li><li>Brambleback: Fixed a bug where his baseline Armor Ignore was higher than intended.</li><li>Brambleback: Fixed a bug where his Armor Ignore would decrease with increasing Ability Power.</li><li>Brambleback Armor Ignore: 15 + 30% AP <span class=\"change-indicator\">⇒</span> 20 + 25% AP</li><li>Ashe Trail Duration: 4s <span class=\"change-indicator\">⇒</span> 3s</li><li>Ashe DoT Base Damage Per Second (AD): 5/8 AD <span class=\"change-indicator\">⇒</span> 9/14 AD</li><li>Draven Bounty Hunter:<ul><li>Casts for 4-costs: 5 <span class=\"change-indicator\">⇒</span> 6</li><li>Reward for 8 Casts: 10 Rerolls <span class=\"change-indicator\">⇒</span> 6 Rerolls</li><li>Attack for 5-cost: 50 <span class=\"change-indicator\">⇒</span> 60</li><li>Damage for 7 Gold: 8,000 <span class=\"change-indicator\">⇒</span> 10,000</li><li>Kills for 12 Gold: 6 <span class=\"change-indicator\">⇒</span> 8</li></ul></li><li>Maokai Mana: 30/90 <span class=\"change-indicator\">⇒</span> 30/100</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">WISPS</h4><blockquote class=\"blockquote context\"><p>Last second Polymorphs are cool, but they’re rarely a good idea as your 3 cost Vi becomes a frontline Aphelios without the time to reposition.</p></blockquote><ul><li>Polymorph: All Polymorph Wisps can only be seen as the 1st Wisp of each Planning Phase.</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">BUG FIXES</h4><ul><li>Fixed a bug where Auto Attack projectiles could get stuck on a dashing champion and deal much more damage than intended.</li><li>Fixed a bug where Krug and Yorick would not spawn their summons when sacrificed by the Blackthorn Hex.</li><li>Fixed a bug where Thief’s Gloves would offer different items when re-equipped to another champion during the same round.</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">PERFORMANCE/STABILITY BUG FIXES</h4><ul><li>Fixed an issue where version mismatch would result in players being stuck on a spinner instead of being notified of a version mismatch with a popup modal</li><li>Fixed a crash issue found on PC related to item subsystems</li><li>Fixed an infinite loading screen issue that occurred when using some VPNS</li><li>Fixed an issue on Tablet where Stylus taps were not being registered</li><li>Fixed performance issues with the following cosmetics/VFX: Twilight Forest Arena, Unbound Katarina, Blaze Wisp</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-midpatch-updates\">18.2 PERFORMANCE/STABILITY IMPROVEMENTS</h2><!-- gekuerzt --><header class=\"header-primary\"><h2 id=\"patch-systems\">SYSTEMS</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">XP PER LEVEL</h4>"}}]}}}}</script></body></html>
