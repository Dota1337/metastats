name: Weekly Data Crawl (KR)

# Korea LoL crawl, split off from the main weekly-crawl. Runs 12 hours
# after the EUW slot so the dev key isn't shared between concurrent runs.
# Once the production key arrives we can collapse this back into the main
# workflow — the dev-key 90 req/2min budget is the only reason for the split.

on:
  schedule:
    # Every Friday at 18:00 UTC (12h after the EUW crawl)
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Sammeln, auch wenn die Datei juenger als 5 Tage ist'
        type: boolean
        default: false
      attempt:
        description: 'Interner Zaehler fuer Neu-Anstoesse durch das Sammel-Tor'
        type: number
        default: 0

permissions:
  contents: write
  actions: write  # Sammel-Tor stoesst den Workflow neu an (scripts/weekly-crawl-gate.mjs)
  issues: write

concurrency:
  group: weekly-crawl-kr
  cancel-in-progress: false

env:
  RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Riot LoL key pre-flight — tolerant. A stale Dev-Key skips the crawl
      # step (the only Riot-dependent step in this workflow) with a warning
      # instead of failing the whole job + spamming the user with notification
      # mails. Once the key is rotated via scripts/refresh-riot-key.mjs, the
      # next scheduled run picks it up automatically.
      - name: Riot LoL key pre-flight
        id: riotcheck
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "${RIOT_API_KEY:-}" ]; then
            echo "lol_key_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RIOT_API_KEY secret is empty — skipping Champion-Stats crawl."
            exit 0
          fi
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -H "X-Riot-Token: $RIOT_API_KEY" "https://kr.api.riotgames.com/lol/status/v4/platform-data")
          if [ "$STATUS" = "200" ]; then
            echo "lol_key_ok=true" >> "$GITHUB_OUTPUT"
            echo "Riot LoL key OK (HTTP 200)."
          else
            echo "lol_key_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Riot LoL key invalid (HTTP $STATUS) — skipping Champion-Stats crawl."
          fi

      # Tor: nur bei alter Datei sammeln und den Marktwert-Pass auf der Box
      # abwarten (teilt sich den Riot-Key). Angestossen wird der Lauf meist von
      # scripts/refresh-riot-key.mjs direkt nach einer Key-Erneuerung.
      - name: Set up SSH
        if: steps.riotcheck.outputs.lol_key_ok == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.HETZNER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Crawl gate (age + box marketvalue pass)
        id: gate
        if: steps.riotcheck.outputs.lol_key_ok == 'true'
        env:
          DATA_FILE: public/champion-stats-kr.json
          FORCE: ${{ inputs.force }}
          BOX_HOST: ${{ secrets.HETZNER_HOST }}
          BOX_KEY: ~/.ssh/deploy_key
          BOX_REGION: kr
          WORKFLOW: weekly-crawl-kr.yml
          ATTEMPT: ${{ inputs.attempt }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/weekly-crawl-gate.mjs

      - name: Crawl Champion Stats (Korea)
        if: steps.riotcheck.outputs.lol_key_ok == 'true' && steps.gate.outputs.run == 'true'
        run: node scripts/collect-kr-cn.mjs

      # Kein `pull --rebase` (Konflikt bei altem Checkout, siehe weekly-crawl.yml);
      # handoff: der angestossene Nachfolger committet selbst.
      - name: Commit data updates
        if: steps.gate.outputs.handoff != 'true'
        uses: ./.github/actions/push-generated
        with:
          files: public/champion-stats-kr.json public/champion-builds-kr.json
          message: |
            chore: weekly KR data update

            Co-Authored-By: claude-flow <ruv@ruv.net>
