name: TFT Weekly Crawl

on:
  schedule:
    # Saturday 06:00 UTC — phased between the LoL Friday crawl and the
    # Sunday marketvalue refresh. Currently EUW only; KR is added once the
    # production key arrives (it doubles the runtime per crawl).
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Gemeinsam mit tft-data-refresh.yml und tft-daily-crawl.yml, alle schreiben public/.
concurrency:
  group: tft-data-writers
  cancel-in-progress: false

env:
  RIOT_API_KEY_TFT: ${{ secrets.RIOT_API_KEY_TFT }}

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    # Production TFT key (~18 req/s effective, capped by match-detail method-limit).
    # ~3500 sampled players * 8 matches → ~20k unique matches → ~20 min crawl.
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Riot TFT key pre-flight
        uses: ./.github/actions/riot-preflight
        with:
          game: tft

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # Refresh the set tag first so the crawler filters on the live set
      # right away (the regular weekly-crawl also runs this, but the TFT
      # workflow runs on a different day so we can't rely on that).
      # Nur Pruefung: public/tft-set.json schreibt allein tft-bpatch-detect.yml
      # (02:17 UTC, taeglich), sonst rebasen mehrere Laeufe gegeneinander.
      - name: Detect TFT set
        run: node scripts/detect-tft-set.mjs --dry-run
        continue-on-error: true

      # Bundle, Texte und Patch-Notes zieht seit 01.11.2026 tft-data-refresh.yml.

      # Neue Bilder des aktuellen Bundles sofort in die eigene Kopie legen
      # (scripts/mirror-tft-icons.mjs). Gedeckelt und ohne Einfluss auf den
      # Rest des Laufs; was fehlt, holt der stuendliche tft-icon-mirror.yml nach.
      - name: Mirror TFT icons to own storage
        run: node scripts/mirror-tft-icons.mjs --max-minutes=25
        timeout-minutes: 30
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Crawl TFT all-ranks (EUW)
        if: env.RIOT_API_KEY_TFT != ''
        run: node scripts/collect-tft-allranks.mjs --region euw1

      - name: Build TFT knowledge graph (EUW)
        run: node scripts/build-tft-knowledge-graph.mjs --region euw1
        continue-on-error: true

      - name: Refresh TFT tier distribution
        run: node scripts/fetch-tft-tier-distribution.mjs
        continue-on-error: true

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tft-stats-*.json public/tft-graph-*.json public/tft-tier-distribution.json
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: weekly TFT data update

          Co-Authored-By: claude-flow <ruv@ruv.net>"
            pushed=""
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              # Ein haengengebliebener Rebase wuerde jeden weiteren Versuch blockieren.
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            # Without this flag the last command executed is `sleep` (exit 0), so
            # three failed push attempts still report a green run.
            [ -n "$pushed" ] || { echo "Push failed after 3 attempts"; exit 1; }
          fi
