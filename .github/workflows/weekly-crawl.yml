name: Weekly Data Crawl (EUW)

# EUW LoL crawl + all once-per-week detect/refresh steps. Korea is in
# weekly-crawl-kr.yml on a different cron slot so neither side has to fit
# into the 360min GHA cap by itself — the previous combined workflow
# couldn't finish reliably with the new build aggregator.

on:
  schedule:
    # Every Friday at 06:00 UTC
    - cron: '0 6 * * 5'
  workflow_dispatch: # Allow manual trigger
    inputs:
      force:
        description: 'Sammeln, auch wenn die Datei juenger als 5 Tage ist'
        type: boolean
        default: false
      attempt:
        description: 'Interner Zaehler fuer Neu-Anstoesse durch das Sammel-Tor'
        type: number
        default: 0

permissions:
  contents: write
  actions: write  # Sammel-Tor stoesst den Workflow neu an (scripts/weekly-crawl-gate.mjs)
  issues: write

# Don't cancel an in-progress run if a manual dispatch fires while the
# scheduled run is still going — Pro-Player + Champion-Stats crawl takes
# hours and double-runs waste API quota.
concurrency:
  group: weekly-crawl-euw
  cancel-in-progress: false

env:
  RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub hard cap for free plan — crawlers are rate-limited by Riot dev key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Riot LoL key pre-flight — sets a job-level output instead of aborting.
      # Pro-Player-Crawl, Season-Detect, Tier-Distribution + TFT-Set-Detect run
      # without any Riot API call, so a stale LoL Dev-Key shouldn't block the
      # whole weekly job. Champion-Stats step gates on this output.
      - name: Riot LoL key pre-flight
        id: riotcheck
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "${RIOT_API_KEY:-}" ]; then
            echo "lol_key_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RIOT_API_KEY secret is empty — skipping Champion-Stats crawl."
            exit 0
          fi
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -H "X-Riot-Token: $RIOT_API_KEY" "https://euw1.api.riotgames.com/lol/status/v4/platform-data")
          if [ "$STATUS" = "200" ]; then
            echo "lol_key_ok=true" >> "$GITHUB_OUTPUT"
            echo "Riot LoL key OK (HTTP 200)."
          else
            echo "lol_key_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Riot LoL key invalid (HTTP $STATUS) — skipping Champion-Stats crawl, continuing with key-less steps."
          fi

      # Tor: nur bei alter Datei sammeln und den Marktwert-Pass auf der Box
      # abwarten (teilt sich den Riot-Key). Angestossen wird der Lauf meist von
      # scripts/refresh-riot-key.mjs direkt nach einer Key-Erneuerung.
      - name: Set up SSH
        if: steps.riotcheck.outputs.lol_key_ok == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.HETZNER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Crawl gate (age + box marketvalue pass)
        id: gate
        if: steps.riotcheck.outputs.lol_key_ok == 'true'
        env:
          DATA_FILE: public/champion-stats-euw.json
          FORCE: ${{ inputs.force }}
          BOX_HOST: ${{ secrets.HETZNER_HOST }}
          BOX_KEY: ~/.ssh/deploy_key
          BOX_REGION: euw1
          # 90 statt 150: der Sammler braucht mit LOL_DEV_KEY_CRAWL ~247 min,
          # zusammen muss es in timeout-minutes 360 passen. Danach Neu-Anstoss.
          MAX_WAIT_MIN: 90
          WORKFLOW: weekly-crawl.yml
          ATTEMPT: ${{ inputs.attempt }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/weekly-crawl-gate.mjs

      # Pro Player Crawler (no Riot API key needed)
      # handoff: das Tor hat einen Nachfolger angestossen, der den ganzen Lauf
      # uebernimmt. Ohne diese Bedingung committen beide dieselben Dateien und
      # der Nachfolger (aelterer Checkout) laeuft in den Konflikt (07.10.2026).
      - name: Crawl Pro Players
        if: steps.gate.outputs.handoff != 'true'
        run: node scripts/crawl-pro-players.mjs

      # Champion Stats Crawler — EUW (needs valid Riot API key).
      # Gated on the pre-flight step so a stale Dev-Key just skips this step
      # instead of failing the whole job.
      # continue-on-error: bricht die Sperre in collect-highelo.mjs ab (Key
      # stirbt mitten im Lauf), bleiben die Champion-Dateien unveraendert —
      # Saison-/Rang-/Set-Schritte und ihr Commit sollen trotzdem laufen. Der
      # letzte Schritt faerbt den Lauf dann rot.
      - name: Crawl Champion Stats (EUW)
        id: champcrawl
        if: steps.riotcheck.outputs.lol_key_ok == 'true' && steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/collect-highelo.mjs

      # Season detection — runs no Riot API, only Data Dragon. Updates
      # public/seasons.json and exposes `season-changed` for the issue step.
      - name: Detect new season
        id: season
        if: steps.gate.outputs.handoff != 'true'
        run: node scripts/detect-season.mjs

      # Pull external rank distribution (esportstales.com -> leagueofgraphs)
      # so the leaderboard chart is real data, not stale hardcoded values.
      # Failure is non-fatal: keeps the previous JSON if scrape breaks.
      - name: Refresh tier distribution
        if: steps.gate.outputs.handoff != 'true'
        run: node scripts/fetch-tier-distribution.mjs
        continue-on-error: true

      # TFT set detection — pulls from CommunityDragon, no Riot API needed.
      # Surfaces a `set-changed` flag for downstream notifications.
      # Nur Pruefung: public/tft-set.json schreibt allein tft-bpatch-detect.yml
      # (02:17 UTC, taeglich), sonst rebasen mehrere Laeufe gegeneinander.
      - name: Detect new TFT set
        id: tftset
        run: node scripts/detect-tft-set.mjs --dry-run
        continue-on-error: true

      # Commit updated data files. Kein `pull --rebase`: ein Lauf mit altem
      # Checkout erzeugt dieselben Dateien wie ein zwischenzeitlicher Commit
      # auf main, der Rebase endet dann im Konflikt. push-generated setzt auf
      # main zurueck und kopiert die Dateien dieses Laufs als Ganzes darueber.
      # seasons.json ist geschuetzt: Handarbeit (Split-Liste) bleibt stehen.
      # Die uebrigen Workflows mit `pull --rebase` sind bewusst unveraendert.
      - name: Commit data updates
        if: steps.gate.outputs.handoff != 'true'
        uses: ./.github/actions/push-generated
        with:
          files: public/pro-players.json public/champion-stats-euw.json public/champion-builds-euw.json public/seasons.json public/tier-distribution.json
          protect: public/seasons.json
          message: |
            chore: weekly data update (pro players + champion stats)

            Co-Authored-By: claude-flow <ruv@ruv.net>

      # If the season detector flagged a major bump, open a GitHub issue so
      # the maintainer can confirm and (if desired) tag historical Marktwert
      # snapshots manually. We do NOT auto-tag snapshots — a false positive
      # would split the historical chart irreversibly.
      - name: Open season-bump issue
        if: steps.season.outputs.season-changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Season bump detected: ${{ steps.season.outputs.previous-season }} → ${{ steps.season.outputs.new-season }}" \
            --body "Detector flagged a new major patch.

          - Previous season: \`${{ steps.season.outputs.previous-season }}\`
          - New season: \`${{ steps.season.outputs.new-season }}\`
          - Start patch: \`${{ steps.season.outputs.start-patch }}\`

          \`public/seasons.json\` has already been updated.

          **Manual follow-up:**
          1. Confirm this is a real season start (Riot's official patch notes).
          2. Decide whether to tag existing \`market_value_history\` rows with the previous season ID.
          3. Close this issue once handled." \
            --label "season-detected" || echo "Issue creation failed (non-fatal)"

      # Splits (Abschnitte innerhalb einer Saison) stehen nur in Riots
      # Patch-Notes, nicht in der Versionsliste. Der Detektor kann sie also
      # nicht selbst setzen — er meldet nur, dass die Liste in
      # public/seasons.json wahrscheinlich veraltet ist. Eingetragen wird von
      # Hand, damit keine erfundene Grenze in die Saison-Zuordnung der
      # gesammelten Matches (patch_minor) laeuft.
      - name: Open split-review issue
        if: steps.season.outputs.split-review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ohne diese Pruefung entstuende jede Woche ein neues Ticket, solange
          # die Split-Liste nicht gepflegt ist.
          open=$(gh issue list --label "season-split-review" --state open --json number --jq "length")
          if [ "$open" != "0" ]; then
            echo "Split-Review-Issue ist bereits offen — kein zweites"
            exit 0
          fi
          gh issue create \
            --title "Split-Liste pruefen (public/seasons.json)" \
            --body "${{ steps.season.outputs.split-reason }}

          Riot veroeffentlicht Split-Grenzen nur in den Patch-Notes. Bitte den
          Start-Patch des neuen Abschnitts nachtragen:

          1. Patch-Notes des laufenden Jahres pruefen.
          2. In public/seasons.json unter currentSeason.splits einen Eintrag
             mit id, label, startPatch und source ergaenzen.
          3. splitsIncomplete entfernen, falls gesetzt.
          4. Issue schliessen." \
            --label "season-split-review" || echo "Issue creation failed (non-fatal)"

      - name: Fail if champion crawl aborted
        if: steps.champcrawl.outcome == 'failure'
        run: |
          echo "::error::Champion-Sammlung abgebrochen (siehe Schritt 'Crawl Champion Stats') — alte Daten bleiben live."
          exit 1

      # Deployment is handled by Vercel's GitHub integration — the push above
      # automatically triggers a production deploy, no CLI step needed here.
