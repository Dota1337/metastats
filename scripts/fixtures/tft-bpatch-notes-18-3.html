<html><head></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"page":{"url":"https://teamfighttactics.leagueoflegends.com/en-us/news/game-updates/teamfight-tactics-patch-18-3/","title":"TFT patch 18.3","displayedPublishDate":"2026-09-22T18:00:00.000Z","blades":[{"type":"articleMasthead"},{"type":"patchNotesRichText","richText":{"body":"<header class=\"header-primary\"><h2 id=\"patch-midpatch-updates\">MID-PATCH UPDATE</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">SEPTEMBER 28TH</h4><blockquote class=\"blockquote context\"><p>Over the weekend, a new strategy appeared that allowed players to consistently achieve two-star 5-costs far earlier than intended. This strategy was made possible due to bugs with the Greater Polymorph Wisp. We've temporarily disabled this until 18.4, when we can fully implement the intended bugfixes.</p></blockquote><ul><li>Major Polymorph has been temporarily disabled</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">SEPTEMBER 24TH</h4><blockquote class=\"blockquote context\"><p>Our 18.3 B patch is both to respond to later meta changes that weren’t covered with the initial patch and to fix a few balance changes that were reverted unintentionally from 18.2 B to 18.3.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">18.3 B PATCH BALANCE CHANGES</h4><blockquote class=\"blockquote context\"><p>A few meta evolutions slipped through our patch notes after we locked our balance changes for 18.3.</p></blockquote><ul><li>Blackthorn AP Sacrifice Base Damage Amp: 14% <span class=\"change-indicator\">⇒</span> 12%</li><li>Kha’Zix Ability Base Damage: 285/400/580 AP <span class=\"change-indicator\">⇒</span> 265/370/535 AP</li><li>Kha’Zix Ability Isolation Damage: 310/445/660 <span class=\"change-indicator\">⇒</span> 285/410/605 AP</li><li>Brambleback cast time is now slightly faster.</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">18.2 CHAMPION TARGETING</h4><blockquote class=\"blockquote context\"><p>With 18.3, we intentionally reverted a subtle Champion Targeting change from 18.2. Our goal is complete parity in champion targeting between Sets 17 and 18, but there have been bugs that have altered melee targeting at the start of combat. An attempted fix to other movement bugs caused unintended effects in 18.2. We’ve reverted that change and are investigating a better way to return parity to targeting.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">18.2 B BALANCE CHANGES RE-ADDED</h4><blockquote class=\"blockquote context\"><p>When we went from 18.2B to 18.3 a few balance changes accidentally reverted. We’re reenabling them as listed below.</p></blockquote><ul><li>Camille Ability Damage: 160/240/410/700 AD <span class=\"change-indicator\">⇒</span> 150/225/375/640 AD</li><li>Leblanc Clone Chance: 10/15/40% <span class=\"change-indicator\">⇒</span> 10/15/30%</li><li>Teemo Small Shroom Damage: 60/90/135 AP <span class=\"change-indicator\">⇒</span> 55/82/130 AP</li><li>Ashe Trail Duration: 4s <span class=\"change-indicator\">⇒</span> 3s</li><li>Ashe DoT Base Damage Per Second (AD): 5/8 AD <span class=\"change-indicator\">⇒</span> 9/14 AD</li><li>Draven Bounty Hunter:<ul><li>Casts for 4-costs: 5 <span class=\"change-indicator\">⇒</span> 6</li><li>Reward for 8 Casts: 10 Rerolls <span class=\"change-indicator\">⇒</span> 6 Rerolls</li><li>Attack for 5-cost: 50 <span class=\"change-indicator\">⇒</span> 60</li><li>Damage for 7 Gold: 8,000 <span class=\"change-indicator\">⇒</span> 10,000</li><li>Kills for 12 Gold: 6 <span class=\"change-indicator\">⇒</span> 8</li></ul></li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">AUGMENTS TEMPORARILY DISABLED</h4><blockquote class=\"blockquote context\"><p>We’ve also run into some issues with four Augments that have bugs/severe balance issues that we want to temporarily disable until we can return them in a more stable form.</p></blockquote><ul><li>Challenger’s Grace has been temporarily disabled due to a bug.</li><li>Dark Ritual has been temporarily disabled.</li><li>Infinity Protection has been temporarily disabled due to a bug.</li><li>Nesting Dolls has been temporarily disabled due to a bug.</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-patch-highlights-\">PATCH HIGHLIGHTS</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><p><a class=\"skins cboxElement\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f5d6f59cf403908057f3a78b82ef8d045b0c7a8a-2400x1350.png\"><span class=\"content-border\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f5d6f59cf403908057f3a78b82ef8d045b0c7a8a-2400x1350.png\"></span></a></p></div></div></div><header class=\"header-primary\"><h2 id=\"patch-large-changes\">LARGE CHANGES</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>Large, like Brambleback's back.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">TRAITS</h4>"}}]}}}}</script></body></html>
