name: TFT Tournament Weekly Crawl

on:
  schedule:
    # Wednesday 09:00 UTC. Phased after Sunday's pro-player crawl so the
    # tournament-results placement→puuid join has the fresh pro list.
    - cron: '0 9 * * 3'
  workflow_dispatch:

# contents: write — the crawler resolves event-dated FX rates (prize-money
# conversion) and caches them in data/fx-rates.json, committed back below so
# re-runs are deterministic and offline-capable.
permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

# Zwei Laeufe gleichzeitig = doppeltes Tempo gegen Liquipedia → 429 → 12 h Sperre.
concurrency:
  group: tft-tournaments
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Seit 2026-09-13 laedt der Crawler nur neue/offene Turniere plus eine
    # kleine Rotation (~70-80 Seiten à 30 s). Der Voll-Lauf (--full, ~330
    # Seiten) passt NICHT in dieses Limit und gehoert in einen Handstart mit
    # angepasstem Timeout.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Crawl TFT tournaments
        run: node scripts/crawl-tft-tournaments.mjs

      # Commit-back of the FX-rate cache (same race-safe retry pattern as the
      # daily/weekly crawl workflows). Without this, every weekly run re-fetches
      # the same historical rates and a frankfurter outage would silently NULL
      # newly crawled prize conversions.
      # always(): auch nach einem Crawl-Fehler sichern, was an Kursen schon
      # geholt wurde (fx-rates.mjs schreibt nach jedem neuen Kurs).
      - name: Commit FX-rate cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fx-rates.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new FX rates."
          else
            git commit -m "chore: weekly TFT tournament FX-rate cache"
            pushed=""
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            # Without this flag the last command executed is `sleep` (exit 0), so
            # three failed push attempts still report a green run.
            [ -n "$pushed" ] || { echo "Push failed after 3 attempts"; exit 1; }
          fi
