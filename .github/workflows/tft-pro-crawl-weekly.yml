name: TFT Pro Player Weekly Crawl

# STILLGELEGT 2026-09-01 — der Zeitplan ist bewusst entfernt.
#
# Die Pro-Spieler-Seite /tft/pros ist seit 2026-08-27 aus
# (app/lib/feature-flags.ts, TFT_PROS_ENABLED = false). Der User hat am
# 2026-09-01 entschieden, dass dann auch die Sammlung dahinter aufhoert:
# "Wir benoetigen logischerweise keine Daten dafuer, wenn wir es nicht aktiv
# als Reiter haben."
#
# Der alte Zeitplan war: - cron: '0 8 * * 0' (Sonntag 08:00 UTC).
# workflow_dispatch bleibt absichtlich, damit ein einmaliger Nachzug ohne
# Code-Aenderung moeglich ist.
#
# Auf der Box sind gleichzeitig metastats-tft-pro-{fullsync,validator}.timer
# disabled worden — Reihenfolge Timer zuerst, weil der Freitags-Lauf sonst ab
# Tag 11 selbst Alarm schlaegt (scripts/validate-tft-pros-loop.mjs:333-353).
#
# Der Turnier-Lauf (.github/workflows/tft-tournaments-weekly.yml) ist davon
# NICHT betroffen und laeuft weiter.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  RIOT_API_KEY_TFT: ${{ secrets.RIOT_API_KEY_TFT }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Budget: Spielerseiten-Crawl ~3,5 min, Discovery ~1,5 min, Roster ~1,5 min,
    # Klassifikation ~2 min. Dazu die Turnier-Historie: Liquipedia erlaubt fuer
    # action=parse nur 1 Request / 30 s. Der flache Durchgang holt eine Seite
    # pro Spieler (80 = 40 min), die volle Historie nur fuer 10 Spieler in
    # Rotation (+5 min). Zusammen ~55 min. Die Deckel sitzen in PIPELINE_STEPS.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Riot TFT key pre-flight
        uses: ./.github/actions/riot-preflight
        with:
          game: tft

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Die komplette Liquipedia-Haelfte der Pro-Pipeline, von der Hetzner-Box
      # hierher verlagert (2026-08-02): Liquipedia beantwortet Anfragen der
      # Box-IP durchgaengig mit 429 — auch einen nackten siteinfo-Call,
      # unabhaengig von User-Agent und Endpoint. Jeder Versuch dort loeste nur
      # einen neuen 12h-Cooldown aus. Von GitHub Actions laeuft derselbe Code
      # problemlos.
      #
      # Bewusst der Loop-Aufruf und NICHT die Einzelscripts: die Schrittliste
      # steht ausschliesslich in scripts/validate-tft-pros-loop.mjs
      # (PIPELINE_STEPS). Wuerden wir sie hier nochmal als run:-Zeilen
      # aufzaehlen, gaebe es zwei Listen, die auseinanderdriften.
      # --steps=liquipedia waehlt die 5 Liquipedia-Schritte plus die
      # abschliessende Klassifikation; die uebrigen laufen freitags auf der Box.
      #
      # GH_TOKEN ist Pflicht: der Loop oeffnet Issues per `gh`, und
      # permissions: issues: write allein reicht dafuer nicht.
      - name: TFT pro pipeline — Liquipedia steps
        if: env.RIOT_API_KEY_TFT != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate-tft-pros-loop.mjs --mode=weekly-full --steps=liquipedia --open-issues
