# Ziel: /etc/needrestart/conf.d/metastats-no-pg.conf auf der Hetzner-Box
#   scp infra/hetzner/needrestart-metastats-no-pg.conf root@37.27.219.140:/etc/needrestart/conf.d/metastats-no-pg.conf
#
# Automatische Sicherheitsupdates (openssl, libc ...) liessen needrestart die
# lokale Postgres neu starten - 5x in 35 Tagen (02.09.-02.10.2026). Jeder
# Neustart bricht laufende Sammler ab (02.10.: Marktwert-Tageslauf, ~12 h
# Sammelzeit verloren). Postgres lauscht nur auf localhost; der Neustart mit
# den neuen Bibliotheken passiert beim naechsten Reboot oder von Hand.
# Ein Update des postgresql-Pakets selbst startet die DB weiterhin neu.
# Rueckweg: Datei auf der Box loeschen.
$nrconf{override_rc}{qr(^postgresql)} = 0;
