# SSH auf der Box: Anmeldung nur mit Schluessel, nie mit Passwort.
#
# Liegt auf der Box als /etc/ssh/sshd_config.d/10-metastats-keys-only.conf.
# sshd nimmt bei doppelten Angaben den ERSTEN Wert; die Include-Zeile steht in
# /etc/ssh/sshd_config ganz oben (Zeile 12), diese Datei gewinnt also.
# Einspielen (von Hand, remote-deploy.sh kopiert keine Systemdateien):
#   scp infra/hetzner/sshd-keys-only.conf root@37.27.219.140:/etc/ssh/sshd_config.d/10-metastats-keys-only.conf
#   ssh root@37.27.219.140 'sshd -t && systemctl reload ssh'
# Danach mit einer ZWEITEN Verbindung pruefen, bevor die erste zugeht.
#
# Warum (24.10.2026): sshd nahm Passwoerter an, 60.292 Fehlversuche in 7 Tagen.
# root und postgres sind passwortgesperrt (passwd -S: L), ein Treffer war also
# nicht moeglich — die Tuer stand trotzdem offen. Zugang haben nur die zwei
# Schluessel in /root/.ssh/authorized_keys (Arbeitsrechner, GitHub-Deploy).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
