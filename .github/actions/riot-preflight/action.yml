name: Riot API key pre-flight
description: >
  Validates the Riot API key before a long crawl. On 401/403 the step fails
  fast with "Riot-Schluessel abgelaufen". The Fehler-Melder
  (scripts/failure-watch.mjs) recognizes that line and opens ONE issue for all
  affected workflows, assigned to the owner (one mail).

inputs:
  game:
    description: 'lol or tft — picks which env var + endpoint to probe'
    required: true

runs:
  using: composite
  steps:
    - name: Validate Riot key
      shell: bash
      run: |
        set -uo pipefail

        if [ "${{ inputs.game }}" = "tft" ]; then
          KEY="${RIOT_API_KEY_TFT:-}"
          LABEL="TFT"
          URL="https://euw1.api.riotgames.com/tft/league/v1/challenger"
        else
          KEY="${RIOT_API_KEY:-}"
          LABEL="LoL"
          URL="https://euw1.api.riotgames.com/lol/status/v4/platform-data"
        fi

        if [ -z "$KEY" ]; then
          echo "::warning::No $LABEL key configured in env — pre-flight skipped"
          exit 0
        fi

        STATUS=$(curl -sS -o /tmp/preflight.body -w "%{http_code}" \
          -H "X-Riot-Token: $KEY" "$URL" || echo "000")
        echo "Riot $LABEL key pre-flight: HTTP $STATUS"

        if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
          # Kein eigenes Issue mehr: der Fehler-Melder erkennt genau diese Zeile
          # (RIOT_PATTERN in scripts/lib/failure-watch.mjs) und legt EIN Issue
          # fuer alle betroffenen Workflows an. Wortlaut nur gemeinsam aendern.
          echo "::error::Riot-Schluessel abgelaufen ($LABEL, HTTP $STATUS). Abbruch vor dem Crawl."
          exit 1
        fi

        if [ "$STATUS" != "200" ] && [ "$STATUS" != "204" ]; then
          echo "::warning::Unexpected pre-flight status $STATUS — continuing"
        fi
