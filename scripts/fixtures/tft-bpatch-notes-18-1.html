<html><head></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"page":{"url":"https://teamfighttactics.leagueoflegends.com/en-us/news/game-updates/teamfight-tactics-patch-18-1/","title":"Teamfight Tactics patch 18.1","displayedPublishDate":"2026-08-25T18:00:00.000Z","blades":[{"type":"articleMasthead"},{"type":"patchNotesRichText","richText":{"body":"<header class=\"header-primary\"><h2 id=\"patch-midpatch-updates\">Mid-Patch Updates</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h3 class=\"change-detail-title\" id=\"patch-august-31st-and-september-1st\">AUGUST 31ST AND SEPTEMBER 1ST</h3><blockquote class=\"blockquote context\"><p>Our third mid-patch update will be rolling out August 31st for the balance changes and September 1st for bug fixes and quality of life improvements.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">TRAITS</h4><blockquote class=\"blockquote context\"><p>Riftbeast (7) has proven to be a super consistent trait whether you’re sitting there to star up your 1-costs, or pushing levels to slot in flexible Legendary units.</p></blockquote><ul><li>Riftbeast (7) Stats: 6% AD/AP/AS <span class=\"change-indicator\">⇒</span> 5% AD/AP/AS</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">CHAMPIONS</h4><blockquote class=\"blockquote context\"><p>Drop Pebbles, Cinderling stocks are on fire! Through optimized builds, and consistency of starring this little guy up via Riftbeast shops, Cinderling’s ramped up as a powerful carry. We’ve got a base AD and ability nerf to keep him in check and give Pebbles fans a more equal footing.<br><br>Cassiopeia Defender is one of the most consistent comps of our patch. We’re taking a big chunk out of the main damage threat here.<br><br>Master Yi is another reroll star that’s become a powerhouse, especially with an Artifact or two. We’re lowering his defenses to keep this melee-carry burstable.<br><br>Amumu has had a lot to cry about with our release patch. Let’s cheer him up with a double buff.<br><br>Draven’s our worst performing 5-cost by a considerable amount. We’re swinging big with a buff to allow him to cast much sooner and take advantage of more bleeds being built up. Attack Speed, which was already his best stat, is going to be even better, so grab those bows!</p></blockquote><ul><li>Cinderling Base AD: 45 <span class=\"change-indicator\">⇒</span> 40</li><li>Cinderling Ability Damage: 340/510/765/1300 AD <span class=\"change-indicator\">⇒</span> 310/465/700/1200 AD</li><li>Cassiopeia Ability Damage: 440/660/1050 AP <span class=\"change-indicator\">⇒</span> 400/600/950 AP</li><li>Master Yi Resists: 60 <span class=\"change-indicator\">⇒</span> 55</li><li>Ahri Ability Damage: 450/675 AP <span class=\"change-indicator\">⇒</span> 425/640 AP</li><li>Amumu Mana buff: 30/140 <span class=\"change-indicator\">⇒</span> 30/125</li><li>Amumu Heal Max HP %: 2.2% <span class=\"change-indicator\">⇒</span> 2.5%</li><li>Morgana Mana nerf: 0/60 <span class=\"change-indicator\">⇒</span> 0/65</li><li>Soraka Initial Star Damage: 190/285 AP <span class=\"change-indicator\">⇒</span> 225/335 AP</li><li>Draven Mana buff: 0/120 <span class=\"change-indicator\">⇒</span> 0/110</li><li>Draven Base AS: 0.8 <span class=\"change-indicator\">⇒</span> 0.85</li><li>Elder Dragon Base AD: 115 <span class=\"change-indicator\">⇒</span> 125</li><li>Lux Ability Damage: 330/520 AP <span class=\"change-indicator\">⇒</span> 355/550 AP</li><li>Lux Lunar Damage Amp: 10% <span class=\"change-indicator\">⇒</span> 8%</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">GAME FEEL AND PERFORMANCE</h4><blockquote class=\"blockquote context\"><p>Note that these changes will be patched separately tomorrow, September first in the early evening. Alongside a few gameplay-related bugfixes we also have a quality of life, or game feel, adjustment for dragging and dropping units to allow for more reactive/snappier unit movement. This should be most noticeable when using the units on your bench as a virtual fidget spinner.<br><br>Update: we discovered some unintended bugs related to the flushing system below so ahead of release, we'll be pushing it back to a future patch.<br><br>In our effort to continue to improve performance across devices, we’ve put in a medium-term fix that “flushes” particles when they build up. This is just one of the fixes we plan on rolling out to improve performance, but this fix should specifically help reduce instances where you experience worsening performance as you get into the later stages of a game. Impact may vary depending on your device specs, but we'll continue to roll out fixes over the next few patches to continue improving here.</p></blockquote><ul><li>Game Feel: Champion Drag and Drop snappiness has been improved</li><li>Late Game Performance: Upgraded our particle flusher tool to boost performance on round transitions and Carousel</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">BUGS</h4><blockquote class=\"blockquote context\"><p>Note that these changes will be patched separately tomorrow, September first in the early evening.</p></blockquote><ul><li>Maladaptive: Using an Item Remover on a starred-up Adaptor no longer swaps them back to their one-star scaling</li><li>Players can no longer repeatedly fight a ghost army multiple rounds in a row</li><li>Alune’s ability can no longer target untargetable units</li><li>Certain Adaptor units no longer revert to a their alternate form’s Mana costs</li><li>Master of All Origins now has proper Icons</li><li>Augment Pillars no longer have white boxes appearing in the icon right after acquiring an Augment</li><li>Double Up: Upgraded Life Debt wisps now properly eliminates players. Maybe don’t buy it at 1 HP.</li><li>Double Up: Final Showdown Encounter now properly gives the two final duos 70 gold</li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h3 class=\"change-detail-title\">AUGUST 28TH</h3><h4 class=\"change-detail-title\">NEW FEATURE</h4><blockquote class=\"blockquote context\"><p>With load times longer than we wanted with our release, we’ve added a spinning graphic in the loading screen to reduce paranoia around whether or not it is a crash or just a longer loading screen. Even with loading times coming down since release, we still want this around and are still working on future optimization.</p></blockquote><ul><li>Added a spinner graphic to pre-match loading screens for all platforms.</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">DOUBLE UP</h4><blockquote class=\"blockquote context\"><p>We’re moving fast and hard here to ship as many bug fixes and performance improvements as possible, but in our eagerness to do so, a new bug emerged yesterday resulting in us temporarily disabled the Double Up queue. It’s back now, so grab your Double Up pal and let em’ know.</p></blockquote><ul><li>Double Up has been reenabled.</li><li>Fixed an exploit where temporary items would become permanent if traded with the friendship cannon.</li></ul><hr class=\"divider\"><h4 class=\"change-detail-title\">BUG FIXES</h4><ul><li>Fixed an issue with a few ability/action instances such as Elise’s transformation, Maokai’s death, Sejuani’s weapon swipe, Sentinel’s Idle VFX, and Tristana’s AOE Explosion having memory leaks.</li><li>Fixed a temporary delay in joining queues on Mobile</li><li>Fixed memory leak of particles in Arena Prancie’s Retreat</li><li>MOBILE: Fixed an issue where the “Update Available” modal would in rare instances kick a player from Mobile on certain devices</li><li>Fixed an issue where Loot orbs would pop-in later than their trailing VFX when dropping from a minion in a PvE round</li><li>Temporarily Disabled Forge A Friend Augment as it wasn’t consistently providing a three-star unit.</li><li>MOBILE: Fixed an issue where some Mobile devices were running TFT in settings that surpassed their hardware recommendations resulting in poor performance</li><li>Fixed an issue where Health Bar subticks rendered too wide</li><li>Fixed an issue with Default Key functions</li><li>MOBILE: Fixed an issue where the “Update Available” modal was unable to be interacted with on certain Mobile devices</li><li>Fixed a bug where Teemo’s mushroom loot could land outside the board on certain Arenas after casting his ability during combat</li><li>Prestige Shyvana will now properly play her Dragon Form boom while in Dragon form</li><li>Change from Vulcan to OpenGL for specific GPUs to reduce graphics related crashes</li><li>Changing the default quality settings for some devices that were performing poorly</li></ul></div></div></div><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h3 class=\"change-detail-title\">AUGUST 27TH</h3><blockquote class=\"blockquote context\"><p>The team’s out with our first round of bug fixes targeting high priority bugs from memory leaks that cause performance issues to Finishers not abiding by global volume/sfx settings (they were loud).<br><br>While this is our first mid-patch update we expect to have another follow up soon with more bugs squashed and a check-in on live balance as the meta evolves.</p></blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">BUG FIXES</h4><ul><li>Fixed a memory leak with the Golden Egg asset</li><li>Fixed a memory leak that could happen when playing Rengar, which could lead to performance issues over time.</li><li>Fixed the End of Game screen sometimes showing the wrong final placement for the players who finished 1st and 2nd in Ranked games.</li><li>Fixed the \"Soul Awakening\" Augment's True Damage only working on Attack Damage instead of also applying to Ability Damage.</li><li>Fixed a bug where changing your loadout in TFT could accidentally unequip items from your League of Legends loadout.</li><li>Fixed a localization bug on mobile where the Performance Mode graphics setting showed English text instead of your selected language.</li><li>Fixed the \"Bobabear\" section of the Tacticians loadout screen showing untranslated (English-only) text.</li><li>Fixed some in-progress cosmetic category titles and item names showing in English regardless of your language setting.</li><li>Fixed a matchmaking issue that could cause you to face the same opponent two rounds in a row.</li><li>Fixed combat sometimes failing to end properly when Gnar knocked a Krug off the board.</li><li>Fixed Little Legend finisher sound effects continuing to play even after turning Global Volume/SFX down to 0.</li><li>Fixed the scoreboard constantly shifting position when purchasing Charms.</li><li>Fixed a bug preventing players from opening Settings</li><li>Fixed overlapping music tracks playing at the same time.</li><li>Improved Kennen's AOE visual effects so they scale better on lower graphics settings.</li><li>Improvements to Performance Mode for lower-spec devices to help maintain frame rate.</li><li>Fixed some load time related issues.</li><li>Fixed several minor memory leak sources.</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-enchanted-wilds-release-performance-notes\">ENCHANTED WILDS RELEASE PERFORMANCE NOTES</h2><!-- gekuerzt --><header class=\"header-primary\"><h2 id=\"patch-systems\">SYSTEMS</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h4 class=\"change-detail-title\">SET MECHANIC: WISPS</h4>"}}]}}}}</script></body></html>
