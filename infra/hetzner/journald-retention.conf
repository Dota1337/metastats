# Aufbewahrung des System-Journals auf der Box: 30 Tage.
#
# Liegt auf der Box als /etc/systemd/journald.conf.d/retention.conf.
# Einspielen (von Hand, remote-deploy.sh kopiert keine Systemdateien):
#   scp infra/hetzner/journald-retention.conf root@37.27.219.140:/etc/systemd/journald.conf.d/retention.conf
#   ssh root@37.27.219.140 'systemctl restart systemd-journald && journalctl --vacuum-time=30d'
#
# Warum (10.10.2026): Backfill und Aggregator der Companion-Daten haben bis
# App 0.8.2 Riot-Namen ins Journal geschrieben, und das Journal hatte keine
# Grenze (3,6 GB, aeltester Eintrag 13.06.). Die Datenschutzerklaerung der App
# nennt 30 Tage fuer Server-Protokolle. Kein Dienst liest aeltere Eintraege —
# einziger Journal-Leser ist scripts/weekly-crawl-gate.mjs, und der liest nur
# den laufenden Durchgang.
[Journal]
MaxRetentionSec=30day
