# metastats systemd-Haertungsboden — Source of Truth.
#
# Dieser Block steht WOERTLICH in jeder infra/hetzner/metastats-*.service
# zwischen den beiden Markerzeilen. Er wird nicht generiert und nicht
# includet — systemd kennt kein Include, und ein Drop-In unter
# /etc/systemd/system/UNIT.service.d/ waere Zustand, den scripts/build-system-map.mjs
# beim Parsen der Unit-Files strukturell nicht sieht. Die Systemkarte wuerde
# dann etwas anderes behaupten als auf der Box gilt, und pre-push Gate 5
# merkte es nicht. Deshalb: Duplikat im Repo, erzwungen durch
# scripts/check-system-map.mjs (Block "Haertungsboden").
#
# Aendern heisst: diese Datei aendern, dann `node scripts/apply-hardening-floor.mjs`,
# dann alle Units per infra/hetzner/apply-units.sh auf die Box.
#
# WARUM EINZELNE NAHELIEGENDE DIREKTIVEN FEHLEN:
#
#   MemoryDenyWriteExecute=yes — bricht JEDE Unit hier. Alle sind
#   /usr/bin/node: V8 braucht W->X-mprotect fuer den JIT, und
#   libsodium-wrappers ist WASM. Der einzige Ausweg waere --jitless, was
#   einen 14h-Crawl unbrauchbar langsam machte.
#
#   User=/DynamicUser= — De-Rooting ist bewusst NICHT Teil dieses Bodens.
#   crawl-allranks-all-regions.mjs und refresh-riot-key.mjs starten per
#   `systemctl` andere Units; als Nicht-Root braeuchte das polkit-Regeln,
#   sonst stirbt die Snapshot-Kette beim naechsten Crawl STILL. Eigene Welle.
#
#   AF_NETLINK steht in RestrictAddressFamilies drin, obwohl es nach zu viel
#   aussieht: glibc getifaddrs() und die c-ares-Initialisierung oeffnen einen
#   Netlink-Socket. Ohne ihn faellt DNS in schwer zuzuordnender Weise aus.
#
#   SystemCallErrorNumber=EPERM statt des Default-SIGSYS: ein SIGSYS mitten
#   in einem 14h-Crawl ist als Exit-Grund nicht von einem OOM-Kill zu
#   unterscheiden. EPERM landet als lesbarer Fehler im Journal.
#
# --- BEGIN metastats-hardening-floor ---
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectClock=yes
ProtectHostname=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
# --- END metastats-hardening-floor ---
