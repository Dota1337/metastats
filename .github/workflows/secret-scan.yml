name: Geheimnis-Suche

# Sucht in neu gepushten Commits nach Schluesseln, Tokens und Passwoertern.
#
# Warum nur die neuen Commits und nicht der ganze Verlauf: der Vollscan ueber
# 962 Commits dauerte gemessen 5 min 18 s, und der Verlauf ist unveraenderlich —
# ein taeglicher Lauf darueber findet jeden Tag dieselben alten Funde. Der
# Verlauf wurde am 19.09.2026 einmal komplett durchsucht, Ergebnis und Bewertung
# stehen im Kopf von .gitleaks.toml. Eine Bereichs-Suche dauert unter einer
# Sekunde.
#
# Das ist die zweite Verteidigungslinie. Die erste ist GitHubs Push-Schutz, der
# einen erkannten Schluessel ablehnt, BEVOR er ueberhaupt ankommt; sie ist seit
# 19.09.2026 eingeschaltet. Dieser Lauf faengt, was deren Muster nicht kennen.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Voller Verlauf, weil sonst der Vergleichspunkt des Bereichs fehlt.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Feste Version mit Pruefsumme statt einer Marketplace-Action: eine Action
      # laeuft mit Zugriff auf den Arbeitsbereich und kann sich unter demselben
      # Tag jederzeit aendern. Hier aendert sich nichts, ohne dass diese Datei
      # sich aendert.
      - name: gitleaks holen
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLf -o gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gl.tar.gz" | sha256sum -c -
          tar xzf gl.tar.gz gitleaks
          ./gitleaks version

      - name: Neue Commits durchsuchen
        env:
          VORHER: ${{ github.event.before }}
          BASIS: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ -n "${BASIS:-}" ]; then
            BEREICH="${BASIS}..HEAD"
          elif [ -n "${VORHER:-}" ] && [ "${VORHER}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${VORHER}^{commit}" 2>/dev/null; then
            BEREICH="${VORHER}..HEAD"
          else
            # Erster Push eines Zweiges oder abgeschnittener Verlauf: die
            # letzten 50 Commits statt stillschweigend nichts zu pruefen.
            BEREICH="HEAD~50..HEAD"
            git cat-file -e "HEAD~50^{commit}" 2>/dev/null || BEREICH="HEAD"
          fi
          echo "Bereich: ${BEREICH}"
          ./gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="${BEREICH}" .
